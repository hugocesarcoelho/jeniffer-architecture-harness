signature_patterns:
  colors:
    - "Branco/off-white como base cromática dominante das paredes e marcenaria clara — alta confiança (branco: 8/8 projetos, 686 ocorrências; off-white: 5/8 projetos, 107 ocorrências)."
    - "Bege como tom neutro complementar recorrente — alta confiança (6/8 projetos, 58 ocorrências)."
    - "Preto / preto fosco como cor de contraste em metais, perfis e rodapés — alta confiança (preto: 7-8/8 projetos, 426 ocorrências; preto fosco: 6/8 projetos, 137 ocorrências)."
    - "Dourado / dourado fosco como metal de assinatura em puxadores, perfis tubulares e detalhes decorativos — alta confiança (dourado: 8/8 projetos, 481 ocorrências; dourado fosco especificamente: 6/8 projetos, 117 ocorrências)."
    - "Tons de madeira nogueira/freijó como acento quente pontual — confiança média (3/8 projetos: ClinicaPatricia-2026, Rafael-Mariana-2026, Sandra; 114 ocorrências)."
  materials:
    - "MDF Duratex como substrato de marcenaria em praticamente toda peça (painéis, prateleiras, portas) — alta confiança (8/8 projetos)."
    - "Gesso em painéis, sancas e forros rebaixados — alta confiança (7/8 projetos, 521 ocorrências)."
    - "Painel ripado (ripas de madeira/MDF) como revestimento de parede ou frente de mobiliário — alta confiança (7/8 projetos: ClinicaPatricia-2026, Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Gabi-2024, Patricia-Rafael-2025, Sandra, Tavora-2026; 145 ocorrências)."
    - "Mármore/pedra natural em bancadas de banheiro, cozinha e lavabo — alta confiança (7/8 projetos)."
    - "Porcelanato em pisos e revestimentos — alta confiança (7/8 projetos)."
    - "Metalon/perfil metálico tubular como estrutura decorativa (aparadores, painéis, guarda-corpos) — confiança média-alta: 4/8 projetos (ClinicaPatricia-2026, Gabi-2024, Patricia-Rafael-2025, Sandra), volume de citações baixo (25 ocorrências) — acompanhar em novos projetos antes de tratar como regra forte."
    - "Espelho como revestimento decorativo (não só de banheiro) — confiança média: 3/8 projetos (ClinicaPatricia-2026, Rafael-Mariana-2026, Sandra; 114 ocorrências)."
  furniture:
    - "Bancada custom com cuba de apoio ou esculpida — alta confiança (bancada: 8/8 projetos; cuba: 8/8 projetos)."
    - "Painel de TV em marcenaria como peça central da sala — alta confiança (6/8 projetos: Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Gabi-2024, Patricia-Rafael-2025, Rafael-Mariana-2026, Sandra)."
    - "Ilha de cozinha — alta confiança (6/8 projetos: ClinicaPatricia-2026, Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Gabi-2024, Patricia-Rafael-2025, Sandra)."
    - "Cabeceira estofada/em marcenaria com painel de fundo como peça central do quarto — alta confiança (6/8 projetos: Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Gabi-2024, Patricia-Rafael-2025, Rafael-Mariana-2026, Sandra)."
    - "Closet integrado — confiança média: 3/8 projetos (Gabi-2024, Patricia-Rafael-2025, Sandra)."
    - "Aparador/buffet combinando com mesa de jantar — confiança média: termo explícito 'mesa de jantar' em 4/8 projetos (Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Patricia-Rafael-2025, Rafael-Mariana-2026), com baixo volume (11 ocorrências) — evidência ainda limitada para o ambiente de jantar como um todo."
  joinery:
    - "Nichos embutidos em painéis de marcenaria ou gesso — alta confiança (8/8 projetos, 185 ocorrências)."
    - "Painel ripado como frente de marcenaria/revestimento — alta confiança (7/8 projetos, ver signature_patterns.materials)."
    - "Puxadores especificados com marca e acabamento definidos (modelo + cor + marca, ex.: 'PUXADOR PLYMOUTH DOURADO - ZEN DESIGN') — alta confiança (puxador: 8/8 projetos; marca Zen Design: 7/8 projetos)."
    - "Perfis metálicos de acabamento dourado fosco ou preto fosco emoldurando painéis e aparadores — alta confiança (ver signature_patterns.colors)."
    - "Perfil de alumínio estrutural em portas/painéis de correr — confiança média: 3/8 projetos (Rafael-Mariana-2026, Patricia-Rafael-2025, Clodoaldo-Vanusa-2025), volume baixo (7 ocorrências)."
  lighting:
    - "Fita de LED embutida contínua, com instrução de não deixar LED/fiação aparente — alta confiança (ver principles.lighting)."
    - "Spots embutidos como iluminação geral — alta confiança (ver principles.lighting)."
    - "Pendentes como iluminação decorativa pontual — alta confiança (ver principles.lighting)."
    - "Temperatura de cor 2700K/3000K especificada em quase toda prancha de iluminação — alta confiança (8/8 projetos, 144-149 ocorrências)."
  composition:
    - "Sanca/rasgo de luz perimetral integrado ao forro rebaixado — alta confiança (6/8 projetos)."
    - "Prancha de detalhamento com sequência fixa: vista topo, vista A, vista B, perspectiva (rotulada 'PESPECTIVA'), cada uma com escala própria — alta confiança (8/8 projetos)."
    - "Contraste entre painéis retilíneos (ripado, liso) e recortes/curvas orgânicas pontuais — confiança média-alta (6/8 projetos para o princípio formal amplo)."
  styling:
    - "Uso de tapete, almofada e vaso como elementos de composição/estilização final dos ambientes renderizados — confiança média-alta (7/8 projetos, 52 ocorrências), mas sem detalhamento suficiente de cor/padronagem no texto extraído para virar regra prescritiva — recomenda-se revisão de imagens (pages/embedded-images) pela arquiteta em uma passada futura."

