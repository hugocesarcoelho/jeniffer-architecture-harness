version: 3
status: in-review
architect: Jeniffer Melo (Jeniffer Melo Arquitetura, CAU A186976-0)
last_reviewed: 2026-08-01

scope:
  project_types:
    - "Residencial: apartamentos e casas — 6 client_projects (Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Gabi-2024, Patricia-Rafael-2025, Rafael-Mariana-2026, Sandra), confirmados pela pasta docs/knowledge-base/raw-pdfs/Residencial/<projeto>/ e pelo campo project_category=\"Residencial\" em catalog.json/manifest.json."
    - "Comercial: clínica estética (ClinicaPatricia-2026) e loja/joalheria (Tavora-2026) — 2 client_projects, confirmados pela pasta docs/knowledge-base/raw-pdfs/Comercial/<projeto>/ e pelo campo project_category=\"Comercial\" em catalog.json/manifest.json."
    - "Mudança em relação à v2: na v2 a categoria comercial/residencial de cada projeto era inferida do conteúdo dos documentos (citações de 'clínica', 'loja', etc.). Na v3, a categoria é um dado explícito e autoritativo fornecido pela própria arquiteta via a reorganização do acervo bruto em pastas Residencial/Comercial — não é mais inferência do agente. Os 8 client_projects e sua categoria são os mesmos identificados na v2; o que mudou é a fonte de verdade da categorização, não a categorização em si."
    - "Atenção (amostra comercial pequena): há apenas 2 client_projects comerciais. Qualquer padrão observado apenas nesses 2 projetos é tratado neste documento como 'observado em contexto comercial (2/2 projetos comerciais), não extrapolar para residencial sem mais evidência' — mesmo quando o critério numérico bruto (≥2 client_projects) tecnicamente classificaria como 'confiança média'. Ver confidence_notes.commercial_sample_caution."
    - "A amostra residencial (6 client_projects) é a base mais robusta deste Design DNA, mas ainda está abaixo do mínimo recomendado de 10-20 projetos — todo padrão 'residencial' aqui é preliminar, não definitivo."
  client_segments: []
  regions:
    - "Belo Horizonte, MG e região metropolitana — inferido do DDD (31) presente no bloco de identificação de todos os 18 documentos, e de menções explícitas a 'BH' em Gabi-2024 (Buritis;BH) e 'Bh' em Rafael-Mariana-2026 (Jaraguá - Bh)."

principles:
  spatial:
    - "Bancada custom como elemento de composição de ambientes com ponto de água/atendimento (cozinha, banheiro, lavabo, e também balcão/bancada de atendimento em programas comerciais) — alta confiança, presente em AMBOS os segmentos: bancada em 8/8 projetos, confirmado nos documentos de ClinicaPatricia-2026 e Tavora-2026 (2/2 comerciais) além dos 6/6 residenciais."
    - "Em programas residenciais, ambientes sociais e íntimos são organizados a partir de marcenaria integrada parede-a-parede que funciona como eixo de composição do cômodo: painel de TV na sala e cabeceira no quarto — alta confiança, mas EXCLUSIVO do segmento residencial: painel de TV confirmado em 6/6 projetos residenciais, cabeceira em 6/6 projetos residenciais; nenhum dos dois termos foi encontrado em nenhum dos 5 documentos dos 2 projetos comerciais (busca direta, 0 ocorrências). Isso é esperado — clínica e loja não têm sala de TV nem quarto no programa — e não deve ser lido como enfraquecimento do padrão, e sim como padrão condicionado ao tipo de ambiente."
    - "Forro rebaixado em gesso com sanca/rasgo de luz perimetral usado para modular o pé-direito e ocultar fiação/pontos técnicos — alta confiança, ambos os segmentos: rebaixo/forro em 8/8 projetos; sanca em 6/8 projetos."
    - "Cada ambiente de marcenaria é sempre representado em múltiplas vistas simultâneas na mesma prancha (vista topo + vista A + vista B + perspectiva), cada uma com escala própria — alta confiança, ambos os segmentos: convenção 'VISTA TOPO' confirmada em 8/8 projetos, incluindo verificação direta em ClinicaPatricia-2026 (47 ocorrências) e Tavora-2026 (24 ocorrências)."
  aesthetic:
    - "Paleta predominantemente neutra com branco/off-white como base e dourado fosco como metal de contraste — alta confiança em ambos os segmentos: branco em 8/8 projetos; dourado fosco em 6/8 projetos, confirmado nos 2/2 projetos comerciais (ClinicaPatricia-2026 e Tavora-2026) além de 4/6 residenciais."
    - "Bege como tom neutro complementar — alta confiança, mas ESPECÍFICO do segmento residencial: presente em 6/6 projetos residenciais e AUSENTE (0 ocorrências, verificado diretamente) nos 2 projetos comerciais. Não tratar bege como parte da paleta comercial da arquiteta sem mais evidência."
    - "Preto fosco como cor de contraste — alta confiança geral (6/8 projetos), mas com assimetria dentro do próprio segmento comercial: presente em Tavora-2026 (loja, uso extenso) e AUSENTE (0 ocorrências, verificado diretamente) em ClinicaPatricia-2026 (clínica, que usa apenas dourado fosco como metal de contraste). Amostra pequena demais para saber se isso é uma escolha pontual de projeto ou um padrão (ex.: metais mais claros/quentes em programas de clínica/saúde) — não generalizar."
    - "Formas/curvas orgânicas usadas como contraponto à marcenaria retilínea — confiança média-alta para o PRINCÍPIO formal, presente em ambos os segmentos (6-8/8 projetos, incluindo os 2 comerciais). Já o NOME literal de produto 'painel orgânico em gesso' está concentrado em apenas 2 client_projects — 1 comercial (ClinicaPatricia-2026) e 1 residencial (Debora-Deivisson-2026) — e está ausente do outro projeto comercial (Tavora-2026, verificado diretamente: 0 ocorrências). Ou seja, mesmo dentro do segmento comercial (2/2) o nome do produto não é consenso: é vocabulário pontual de 1-2 projetos específicos, não assinatura de segmento nem da arquiteta como um todo — não tratar o nome exato como universal, apenas o princípio formal mais amplo."
    - "Elementos de estilização (tapete, almofada, vaso) usados para suavizar ambientes de marcenaria rígida — confiança média-alta: 7/8 projetos, com baixo detalhamento textual (cor/padronagem não especificados na maioria dos casos). Não foi feita verificação direta da divisão residencial/comercial deste item nesta passada."
  functional:
    - "Nota padronizada de verificação em obra ('CONFIRMAR MEDIDAS NO LOCAL ANTES DA EXECUÇÃO') anexada às pranchas de marcenaria antes da fabricação — alta confiança, ambos os segmentos: 7/8 projetos, confirmado nos 2/2 projetos comerciais (ClinicaPatricia-2026: docs de detalhamento e executivo-a3; Tavora-2026: ambos os documentos)."
    - "Instrução explícita de ocultar fiação/LED ('NÃO DEIXAR LED APARENTE' / 'NÃO DEIXAR FIAÇÃO APARENTE') nas cavas de iluminação embutida — confiança média-alta: nota explícita em 4/8 projetos; o elemento fita de LED embutida em si está presente em 8/8 projetos. Divisão exata por segmento não verificada diretamente nesta passada."
    - "Nota geral de coordenação entre plano de forro e plano de iluminação ('A EXECUÇÃO DO FORRO DEVE SER REALIZADA CONJUNTAMENTE COM A PLANTA DE ILUMINAÇÃO...'), reaproveitada quase verbatim entre projetos executivos — confiança média: confirmado em exatamente 3 client_projects — 1 comercial (ClinicaPatricia-2026, 3 ocorrências no mesmo documento) + 2 residenciais (Gabi-2024, Patricia-Rafael-2025). Como só há 2 projetos comerciais no total, essa nota aparece em apenas metade da amostra comercial e um terço da amostra residencial — não generalizar para nenhum dos dois segmentos isoladamente."
  lighting:
    - "Fita de LED embutida e contínua como solução dominante de iluminação indireta — alta confiança, ambos os segmentos: 8/8 projetos (matematicamente inclui os 2/2 comerciais, dado que só há 2 projetos comerciais na amostra total)."
    - "Spots embutidos como iluminação geral complementar — alta confiança, muito provavelmente ambos os segmentos: 7/8 projetos (contagem restrita ao termo isolado 'SPOT'; incluindo variações/compostos, 8/8) — com apenas 2 projetos comerciais na amostra, uma contagem de 7-8/8 implica presença em pelo menos 1 e provavelmente ambos os projetos comerciais."
    - "Pendentes como elemento de iluminação decorativa pontual (sobre bancadas, mesas, aparadores) — alta confiança: 6/8 projetos. Não foi feita verificação direta da divisão residencial/comercial deste item nesta passada; como pendentes tipicamente acompanham mesa de jantar/bancada de cozinha (padrões majoritariamente residenciais neste acervo), é plausível que o padrão seja mais forte no segmento residencial, mas isso não foi confirmado."
    - "Temperatura de cor da luz especificada consistentemente em 2700K ou 3000K (luz quente) — alta confiança, ambos os segmentos: 8/8 projetos."
    - "Trilho eletrificado como solução pontual — CORRIGIDO em relação à v2: a v2 atribuía este padrão também a ClinicaPatricia-2026, mas a verificação direta nesta passada mostra que a única ocorrência do termo 'TRILHO' nos documentos de ClinicaPatricia-2026 é 'EMBUTIR TRILHO DA PORTA RENTE AO PISO' (trilho de porta de correr, item de marcenaria/vidro, não luminária). Não há nenhuma ocorrência de 'trilho eletrificado' (luminária) nos 5 documentos comerciais. O padrão de trilho eletrificado como luminária é, portanto, EXCLUSIVAMENTE residencial nesta amostra: confiança média-baixa (2 client_projects — Gabi-2024, Patricia-Rafael-2025 — de 6 residenciais; 0/2 comerciais)."
  materiality:
    - "MDF (majoritariamente linha Duratex, com nomes de cor específicos como 'Carvalho Hanover', 'Cinza Fóssil', 'Branco Diamante') como substrato dominante de marcenaria — alta confiança, ambos os segmentos: MDF em 8/8 projetos, confirmado diretamente em Tavora-2026 (78 e 58 ocorrências nos 2 documentos) além dos demais 7; marca Duratex citada em 8/8 projetos."
    - "Mármore/pedra natural especificado em bancadas — alta confiança GERAL (7/8 projetos), mas dentro do segmento comercial só um dos dois projetos usa: presente em ClinicaPatricia-2026 (extenso) e AUSENTE (0 ocorrências, verificado diretamente nos 2 documentos) em Tavora-2026. Ou seja: 6/6 residenciais + 1/2 comerciais."
    - "Porcelanato em revestimentos de piso/parede — alta confiança, ambos os segmentos: 7/8 projetos, confirmado nos 2/2 projetos comerciais (ClinicaPatricia-2026 e Tavora-2026) + 5/6 residenciais."
    - "Vidro em boxes, guarda-corpos e tampos — alta confiança: 8/8 projetos (contagem consistente com presença em ambos os segmentos, dado que há apenas 2 projetos comerciais na amostra)."
    - "Puxadores e perfis metálicos com acabamento dourado fosco ou preto fosco, frequentemente da marca Zen Design — alta confiança, ambos os segmentos: puxador em 8/8 projetos; marca Zen Design confirmada diretamente em ClinicaPatricia-2026 e em ambos os documentos de Tavora-2026, além de 5/6 residenciais (7/8 no total)."
    - "Tinta da marca Suvinil especificada nominalmente — CORRIGIDO em relação à v2: verificação direta mostra que Suvinil está presente em AMBOS os projetos comerciais (ClinicaPatricia-2026 e Tavora-2026), não é exclusividade residencial. A marca 'Coral' aparece adicionalmente em ClinicaPatricia-2026 — não substituindo o Suvinil, mas coexistindo com ele nesse projeto específico — e segue sendo tratada como preferência pontual desse cliente/projeto (1 client_project), não como assinatura geral. Suvinil: alta confiança, ambos os segmentos (7/8 projetos)."
  sustainability: []

signature_patterns:
  colors:
    - "Branco/off-white como base cromática dominante das paredes e marcenaria clara — alta confiança, ambos os segmentos (branco: 8/8 projetos, 686 ocorrências; off-white: 5/8 projetos, 107 ocorrências, incluindo ClinicaPatricia-2026 mas não confirmado em Tavora-2026 — off-white é, portanto, 1/2 comercial + 4/6 residencial)."
    - "Bege como tom neutro complementar recorrente — alta confiança, mas EXCLUSIVO do segmento residencial (6/6 projetos residenciais; 0/2 comerciais, verificado diretamente). Ver principles.aesthetic."
    - "Preto / preto fosco como cor de contraste em metais, perfis e rodapés — alta confiança geral (preto: 7-8/8 projetos; preto fosco: 6/8 projetos), mas assimétrico dentro do comercial: presente em Tavora-2026, ausente em ClinicaPatricia-2026. Ver principles.aesthetic."
    - "Dourado / dourado fosco como metal de assinatura em puxadores, perfis tubulares e detalhes decorativos — alta confiança, ambos os segmentos (dourado: 8/8 projetos; dourado fosco: 6/8 projetos, confirmado nos 2/2 projetos comerciais)."
    - "Tons de madeira nogueira/freijó como acento quente pontual — confiança média (3 client_projects: 1 comercial — ClinicaPatricia-2026 — + 2 residenciais — Rafael-Mariana-2026, Sandra; 114 ocorrências). AUSENTE em Tavora-2026 (0 ocorrências, verificado diretamente) — não é um padrão do segmento comercial como um todo, apenas de 1 dos 2 projetos comerciais."
  materials:
    - "MDF Duratex como substrato de marcenaria em praticamente toda peça (painéis, prateleiras, portas) — alta confiança, ambos os segmentos (8/8 projetos)."
    - "Gesso em painéis, sancas e forros rebaixados — alta confiança (7/8 projetos, 521 ocorrências). Divisão exata residencial/comercial não verificada diretamente nesta passada, mas consistente com o padrão de forro rebaixado descrito em principles.spatial (ambos os segmentos)."
    - "Painel ripado (ripas de madeira/MDF) como revestimento de parede ou frente de mobiliário — alta confiança, ambos os segmentos: 7/8 projetos, confirmado em ClinicaPatricia-2026 e Tavora-2026 (2/2 comerciais) + 5/6 residenciais (falta apenas Rafael-Mariana-2026)."
    - "Mármore/pedra natural em bancadas de banheiro, cozinha e lavabo — alta confiança GERAL, mas 1/2 no segmento comercial (só ClinicaPatricia-2026; Tavora-2026 não usa). Ver principles.materiality."
    - "Porcelanato em pisos e revestimentos — alta confiança, ambos os segmentos (7/8 projetos, 2/2 comerciais + 5/6 residenciais)."
    - "Metalon/perfil metálico tubular como estrutura decorativa (aparadores, painéis, guarda-corpos) — confiança média: 4 client_projects — 1 comercial (ClinicaPatricia-2026) + 3 residenciais (Gabi-2024, Patricia-Rafael-2025, Sandra); AUSENTE em Tavora-2026 nesta amostra. Volume de citações baixo (25 ocorrências) — acompanhar em novos projetos antes de tratar como regra forte."
    - "Espelho como revestimento/elemento decorativo — RECLASSIFICADO para ALTA confiança em relação à v2 (que o registrava como 'confiança média, 3/8 projetos: ClinicaPatricia-2026, Rafael-Mariana-2026, Sandra'). Verificação direta nesta passada encontrou 'ESPELHO' em TODOS os documentos checados, incluindo os 2 comerciais (ClinicaPatricia-2026 extenso; Tavora-2026, 6 ocorrências) e em pelo menos mais 4 client_projects residenciais que a v2 não havia contabilizado (Clodoaldo-Vanusa-2025: 11 ocorrências; Gabi-2024: 24; Debora-Deivisson-2026: 2; Patricia-Rafael-2025: 15), além dos já conhecidos Rafael-Mariana-2026 e Sandra. Ou seja, provavelmente 8/8 client_projects, ambos os segmentos — mas o texto extraído não permite confirmar se sempre se trata de espelho DECORATIVO com moldura (vs. espelho de banheiro genérico ou uso do termo em outro sentido); recomenda-se confirmação da arquiteta antes de tratar como assinatura estética forte."
  furniture:
    - "Bancada custom com cuba de apoio ou esculpida — alta confiança, ambos os segmentos (bancada: 8/8 projetos; cuba: 8/8 projetos, confirmado em Tavora-2026: 7 e 6 ocorrências nos 2 documentos)."
    - "Painel de TV em marcenaria como peça central da sala — alta confiança, mas EXCLUSIVO do segmento residencial: 6/6 projetos residenciais (Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Gabi-2024, Patricia-Rafael-2025, Rafael-Mariana-2026, Sandra); 0/2 comerciais (0 ocorrências verificadas diretamente nos 5 documentos de ClinicaPatricia-2026 e Tavora-2026)."
    - "Ilha de cozinha — CORRIGIDO em relação à v2: a v2 listava ClinicaPatricia-2026 entre os projetos com 'ilha', mas verificação direta nesta passada encontrou ZERO ocorrências do termo em qualquer um dos 5 documentos comerciais (ClinicaPatricia-2026 e Tavora-2026). O padrão é, portanto, EXCLUSIVO do segmento residencial: alta confiança dentro do residencial (5/6 projetos: Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Gabi-2024, Patricia-Rafael-2025, Sandra; falta apenas Rafael-Mariana-2026), 0/2 comercial."
    - "Cabeceira estofada/em marcenaria com painel de fundo como peça central do quarto — alta confiança, mas EXCLUSIVO do segmento residencial: 6/6 projetos residenciais; 0/2 comerciais (0 ocorrências verificadas diretamente)."
    - "Closet integrado — confiança média, EXCLUSIVO do segmento residencial: 3/6 projetos residenciais (Gabi-2024, Patricia-Rafael-2025, Sandra); 0/2 comerciais."
    - "Aparador/buffet combinando com mesa de jantar — confiança média, EXCLUSIVO do segmento residencial: termo explícito 'mesa de jantar' em 4/6 projetos residenciais (Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Patricia-Rafael-2025, Rafael-Mariana-2026); 0/2 comerciais. Volume de citações ainda baixo (11 ocorrências) — evidência limitada mesmo dentro do residencial."
  joinery:
    - "Nichos embutidos em painéis de marcenaria ou gesso — alta confiança, ambos os segmentos (8/8 projetos, 185 ocorrências; confirmado em Tavora-2026: 7 ocorrências)."
    - "Painel ripado como frente de marcenaria/revestimento — alta confiança, ambos os segmentos (ver signature_patterns.materials)."
    - "Puxadores especificados com marca e acabamento definidos (modelo + cor + marca, ex.: 'PUXADOR PLYMOUTH DOURADO - ZEN DESIGN') — alta confiança, ambos os segmentos (puxador: 8/8 projetos; marca Zen Design confirmada em ClinicaPatricia-2026 e Tavora-2026)."
    - "Perfis metálicos de acabamento dourado fosco ou preto fosco emoldurando painéis e aparadores — alta confiança geral, com a assimetria comercial descrita em signature_patterns.colors (dourado fosco em ambos, preto fosco só em Tavora-2026 dentro do comercial)."
    - "Perfil de alumínio estrutural em portas/painéis de correr — confiança média, sem evidência no segmento comercial nesta amostra: 3 client_projects residenciais (Rafael-Mariana-2026, Patricia-Rafael-2025, Clodoaldo-Vanusa-2025), volume baixo (7 ocorrências)."
  lighting:
    - "Fita de LED embutida contínua, com instrução de não deixar LED/fiação aparente — alta confiança, ambos os segmentos (ver principles.lighting)."
    - "Spots embutidos como iluminação geral — alta confiança, muito provavelmente ambos os segmentos (ver principles.lighting)."
    - "Pendentes como iluminação decorativa pontual — alta confiança geral; divisão por segmento não verificada diretamente (ver principles.lighting)."
    - "Temperatura de cor 2700K/3000K especificada em quase toda prancha de iluminação — alta confiança, ambos os segmentos (8/8 projetos, 144-149 ocorrências)."
  composition:
    - "Sanca/rasgo de luz perimetral integrado ao forro rebaixado — alta confiança (6/8 projetos); divisão exata por segmento não verificada diretamente, mas consistente com forro rebaixado presente em ambos os segmentos."
    - "Prancha de detalhamento com sequência fixa: vista topo, vista A, vista B, perspectiva (rotulada 'PESPECTIVA'), cada uma com escala própria — alta confiança, ambos os segmentos (8/8 projetos; 'VISTA TOPO' confirmado com 47 ocorrências em ClinicaPatricia-2026 e 24 em Tavora-2026)."
    - "Contraste entre painéis retilíneos (ripado, liso) e recortes/curvas orgânicas pontuais — confiança média-alta para o princípio formal amplo (6/8 projetos, ambos os segmentos); ver ressalva sobre o nome literal 'painel orgânico' em principles.aesthetic."
  styling:
    - "Uso de tapete, almofada e vaso como elementos de composição/estilização final dos ambientes renderizados — confiança média-alta (7/8 projetos, 52 ocorrências), mas sem detalhamento suficiente de cor/padronagem no texto extraído para virar regra prescritiva, e sem verificação direta da divisão residencial/comercial nesta passada — recomenda-se revisão de imagens (pages/embedded-images) pela arquiteta em uma passada futura."

room_patterns:
  sala:
    - "Painel de TV em marcenaria (MDF Duratex) com nicho e/ou fita de LED perimetral — alta confiança, mas o próprio room_pattern 'sala de estar/TV' é por definição residencial neste acervo: nenhum dos 2 projetos comerciais tem um ambiente equivalente no programa (clínica e loja não têm 'sala de TV'). 6/6 projetos residenciais."
    - "Sanca/forro rebaixado com iluminação indireta 2700K/3000K — alta confiança (6/8 projetos), provavelmente ambos os segmentos, já que forro rebaixado e temperatura de cor foram confirmados também nos documentos comerciais."
  cozinha:
    - "Bancada em mármore/pedra com cuba — alta confiança, ambos os segmentos (bancada+cuba confirmados em ClinicaPatricia-2026 e Tavora-2026); já o revestimento em mármore especificamente é 1/2 comercial (só ClinicaPatricia-2026 — ver materiality)."
    - "Ilha central — CORRIGIDO: alta confiança, mas EXCLUSIVO do segmento residencial (5/6 projetos residenciais; 0/2 comerciais — ver signature_patterns.furniture)."
  jantar:
    - "Aparador/buffet em marcenaria combinando com a mesa, com puxador metálico dourado — confiança média, EXCLUSIVO do segmento residencial (evidência direta de 'mesa de jantar' em 4/6 projetos residenciais; 0/2 comerciais; volume de citações ainda baixo)."
  quarto:
    - "Cabeceira estofada ou em painel de marcenaria como peça central — alta confiança, EXCLUSIVO do segmento residencial (6/6 projetos residenciais; 0/2 comerciais, pois clínica/loja não têm quarto no programa)."
    - "Closet integrado, quando presente no programa — confiança média, EXCLUSIVO do segmento residencial (3/6 projetos residenciais)."
  banheiro:
    - "Bancada em mármore/pedra com cuba de apoio ou esculpida — alta confiança geral; bancada+cuba em ambos os segmentos, mármore especificamente 1/2 no comercial (ver materiality)."
    - "Box de vidro — alta confiança geral (vidro em 8/8 projetos); o termo específico 'box'/'banheira' (6/8 projetos) não teve a divisão residencial/comercial verificada diretamente nesta passada."
    - "Espelho decorativo — RECLASSIFICADO para alta confiança e ambos os segmentos nesta passada (ver signature_patterns.materials); a v2 subcontava este padrão como 'confiança média, 3/8'."
  fachada:
    - "REESCRITO em relação à v2 (que descrevia 'evidência insuficiente... concentram-se em 2 projetos comerciais mais uma citação isolada'). Verificação direta nesta passada: fachada é documentada com prancha dedicada, índice próprio e sequência de vistas em AMBOS os projetos comerciais (ClinicaPatricia-2026: 16 ocorrências de 'FACHADA' num único documento; Tavora-2026: 1 + 8 ocorrências nos 2 documentos, incluindo entrada de índice '02. FACHADA')."
    - "No segmento residencial, fachada NÃO é uma citação isolada como a v2 sugeria — é uma estrutura real e específica, mas presente em apenas 1 dos 6 client_projects residenciais: Patricia-Rafael-2025 (documento residencial-patricia-rafael-2025-layout-pr), que tem índice '02. FACHADA', 3x 'Imagens Fachada', 'Pespectiva - Fachada', 'Planta Layout - Fachada' e uma sequência completa 'Vista A/B/C/D - Fachada / Garagem'. Os outros 5 client_projects residenciais (Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Gabi-2024, Rafael-Mariana-2026, Sandra) têm ZERO ocorrências de 'FACHADA' em qualquer documento — verificado diretamente em todos os 11 documentos desses 5 projetos."
