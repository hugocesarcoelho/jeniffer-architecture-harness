  sala:
    - "Painel de TV em marcenaria (MDF Duratex) com nicho e/ou fita de LED perimetral — alta confiança (6/8 projetos)."
    - "Sanca/forro rebaixado com iluminação indireta 2700K/3000K — alta confiança (6/8 projetos)."
  cozinha:
    - "Ilha central — alta confiança (6/8 projetos)."
    - "Bancada em mármore/pedra com cuba — alta confiança (7-8/8 projetos)."
  jantar:
    - "Aparador/buffet em marcenaria combinando com a mesa, com puxador metálico dourado — confiança média (evidência direta de 'mesa de jantar' em 4/8 projetos; volume de citações ainda baixo)."
  quarto:
    - "Cabeceira estofada ou em painel de marcenaria como peça central — alta confiança (6/8 projetos)."
    - "Closet integrado, quando presente no programa — confiança média (3/8 projetos)."
  banheiro:
    - "Bancada em mármore/pedra com cuba de apoio ou esculpida — alta confiança (7-8/8 projetos)."
    - "Box de vidro — alta confiança (vidro em 8/8 projetos; termo 'box'/'banheira' em 6/8 projetos)."
    - "Espelho decorativo com moldura/perfil metálico — confiança média (3/8 projetos: ClinicaPatricia-2026, Rafael-Mariana-2026, Sandra)."
  fachada:
    - "Evidência insuficiente para residências: menções a fachada concentram-se em 2 projetos comerciais (ClinicaPatricia-2026 — clínica, Tavora-2026 — loja) mais uma citação isolada em Patricia-Rafael-2025. Não generalizar para fachada residencial sem mais amostras — ver confidence_notes.insufficient_evidence."
  area_externa:
    - "Elementos de jardim/paisagismo/área gourmet aparecem em 4/8 projetos (ClinicaPatricia-2026, Debora-Deivisson-2026, Gabi-2024, Patricia-Rafael-2025) — confiança média, sem detalhamento suficiente para regras específicas de composição de área externa."

avoid_patterns: []

conditional_patterns:
  - "Quando o ambiente é sala de estar/TV, o padrão dominante é painel de marcenaria com nicho para TV e fita de LED perimetral (6/8 projetos)."
  - "Quando o ambiente é banheiro, lavabo ou cozinha, o padrão dominante é bancada em mármore/pedra com cuba de apoio ou esculpida (7-8/8 projetos)."
  - "Quando há espelho decorativo em áreas sociais ou banheiros, ele tende a vir emoldurado por perfil metálico dourado fosco ou preto fosco (evidenciado em ClinicaPatricia-2026, Rafael-Mariana-2026 e Sandra — 3/8 projetos)."
  - "Quando o projeto é comercial (clínica/loja, como ClinicaPatricia-2026 e Tavora-2026), a documentação inclui prancha dedicada de fachada e um índice de pranchas por ambiente no formato 'PLANTA DE LAYOUT E TÉCNICA <AMBIENTE>' + 'VISTAS <AMBIENTE>'; essa estrutura de fachada comercial não deve ser presumida para fachadas residenciais, que não têm evidência equivalente no acervo atual."
  - "Quando a prancha é de detalhamento de marcenaria (não de layout/planta), ela segue a convenção fixa: vista topo + vista A + vista B + perspectiva ('PESPECTIVA'), cada uma com escala própria, mais nota de confirmação de medidas em obra (8/8 projetos)."

documentation_style:
  sheet_structure:
    - "Bloco de identificação padrão em toda prancha: 'Jeniffer Melo Arquitetura', telefone (31) 992643359, e-mail jeniffermeloarq@gmail.com, campos PROJETO/DATA/FOLHA/CLIENTE/DESENHO/ARQUITETA e registro 'CAU - A186976-0' — presente em 18/18 documentos, 8/8 projetos."
    - "Numeração de folha no formato 'NN/total' (ex.: 87/131, 01/81) consistente em todos os cadernos — alta confiança (8/8 projetos)."
    - "Cadernos de detalhamento abrem com folha de rosto 'CADERNO DE DETALHAMENTO'; quando capturado em texto, o sumário lista seções por ambiente com página inicial (ex.: sandra-sg-det-geral, página 2: '3. SALA; LAVABO / 23. COZINHA / 43. ÁREA DE SERVIÇO / 49. GOURMET / 67. MASTER / 90. SUITE S1 / 103. SUITE S2 / 118. ESCRITÓRIO / 126. ESPELHOS / 129. MARMORARIA / 143. NOTAS') — confiança média-alta (estrutura clara em 2 documentos, ecos parciais em outros)."
    - "Cadernos executivos organizam pranchas na sequência: perspectiva → planta de demolição/construção → planta de piso/acabamentos → pontos hidráulicos → pontos elétricos → planta de forro → pontos de iluminação → imagens 3D → depois, por ambiente: 'PLANTA DE LAYOUT E TÉCNICA <AMBIENTE>' + 'VISTAS <AMBIENTE>' → fachada → notas finais — evidência textual completa em clinicapatricia-2026-layout-a4-vistas (páginas 1-2); nomenclatura parcialmente ecoada em gabi-2024-executivo-a3---geral, patricia-rafael-2025-executivo-pr-a3 e rafael-mariana-2026-rafael-e-mariana-executivo — confiança média (provavelmente é o padrão real da arquiteta, mas a amostra textual direta e completa é mais forte em 1 projeto; outros podem ter a mesma estrutura em desenho vetorial não capturado como texto de índice)."
    - "Cada prancha de detalhamento de marcenaria segue o padrão: vista topo + vista A + vista B (todas com escala explícita, ex. 'ESCALA 1:20'/'ESCALA 1:25') + perspectiva sem escala — alta confiança (8/8 projetos). Exemplo: rafael-mariana-2026-detalhamento-rm, página 3."
  annotation_style:
    - "Grafia consistente 'PESPECTIVA' (sem o 'r') em vez de 'PERSPECTIVA' como rótulo de vista tridimensional — hábito de nomenclatura pessoal recorrente, alta confiança (392 ocorrências em 14 documentos, 8/8 projetos). Exemplo: rafael-mariana-2026-detalhamento-rm, página 2, campo DESENHO = 'Pespectiva'."
    - "Nota de alerta padronizada em maiúsculas com marcador '**', do tipo '**CONFIRMAR MEDIDAS NO LOCAL ANTES DA EXECUÇÃO', anexada a pranchas de marcenaria — alta confiança (7/8 projetos). Exemplo: rafael-mariana-2026-detalhamento-rm, página 3."
    - "Nota de coordenação repetida quase verbatim em cadernos executivos: 'A EXECUÇÃO DO FORRO DEVE SER REALIZADA CONJUNTAMENTE COM A PLANTA DE ILUMINAÇÃO PARA EVITAR INCOMPATIBILIDADES ENTRE PONTOS DE LUZ E RECORTES NO GESSO' — confiança média (3/8 projetos: ClinicaPatricia-2026, Gabi-2024, Patricia-Rafael-2025)."
    - "Callouts de material seguem o padrão '<PEÇA> EM/NO <MATERIAL> <COR> - <MARCA>' (ex.: 'APARADOR EM MDF BRANCO DIAMANTE - DURATEX', 'PUXADOR PLYMOUTH DOURADO- ZEN DESING', 'PERFIL METÁLICO DOURADO FOSCO') — alta confiança (8/8 projetos). Exemplo: gabi-2024-detalhamento-final-ga, página 2 (folha 01/81)."
  specification_depth:
    - "Marca de material especificada explicitamente em vez de apenas o material genérico (Duratex para MDF, Zen Design para puxadores, Suvinil para tinta) — alta confiança (Duratex 8/8; Zen Design 7/8; Suvinil 7/8 projetos)."
    - "Temperatura de cor da iluminação (2700K/3000K) sempre especificada nas cavas de LED e spots — alta confiança (8/8 projetos)."
    - "Cotas numéricas detalhadas acompanham cada elemento de marcenaria (larguras/alturas em cm ao lado de cada peça no desenho) — presença universal nas amostras revisadas; não foi identificada tabela de quantitativos separada no texto extraído (ver table_patterns)."
  table_patterns:
    - "Não foram identificadas tabelas tabulares clássicas (colunas do tipo ITEM/QTD/MATERIAL) no texto extraído; quantitativos e materiais aparecem como legendas soltas próximas às cotas do desenho técnico — confiança média (observação consistente na amostra, mas pode refletir limitação da extração de texto de PDFs de CAD, não necessariamente ausência real de tabelas no desenho vetorial)."
    - "Sumário de pranchas em lista numerada funciona como índice (ex.: '69. PLANTA DE LAYOUT E TÉCNICA LAVABO / 70. VISTAS LAVABO') — confiança média (evidenciado claramente em ClinicaPatricia-2026 e Sandra)."

