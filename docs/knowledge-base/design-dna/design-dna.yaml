scope:
  project_types:
    - "Residencial: apartamentos e casas (Clodoaldo-Vanusa-2025, Debora-Deivisson-2026, Gabi-2024, Patricia-Rafael-2025, Rafael-Mariana-2026, Sandra)."
    - "Comercial: clínica estética (ClinicaPatricia-2026) e loja/joalheria (Tavora-2026) — atenção: padrões observados nesses dois projetos podem refletir programa comercial (recepção, vitrine, fachada de loja) e não devem ser generalizados automaticamente para residências."
  client_segments: []
  regions:
    - "Belo Horizonte, MG e região metropolitana — inferido do DDD (31) presente no bloco de identificação de todos os 18 documentos, e de menções explícitas a 'BH' em Gabi-2024 (Buritis;BH) e 'Bh' em Rafael-Mariana-2026 (Jaraguá - Bh)."

principles:
  spatial:
    - "Ambientes organizados a partir de marcenaria integrada parede-a-parede (painel de TV, cabeceira, bancada) que funciona como eixo de composição do cômodo — alta confiança: painel de TV em 6/8 projetos, cabeceira em 6/8, bancada em 8/8 projetos."
    - "Forro rebaixado em gesso com sanca/rasgo de luz perimetral usado para modular o pé-direito e ocultar fiação/pontos técnicos — alta confiança: rebaixo/forro em 8/8 projetos; sanca em 6/8 projetos."
    - "Cada ambiente de marcenaria é sempre representado em múltiplas vistas simultâneas na mesma prancha (vista topo + vista A + vista B + perspectiva), cada uma com escala própria — alta confiança: convenção 'VISTA TOPO' presente em 8/8 projetos."
  aesthetic:
    - "Paleta predominantemente neutra (branco/off-white/bege) com metais dourado fosco e preto fosco como acabamento de contraste em puxadores e perfis — alta confiança: branco em 8/8 projetos, dourado em 8/8, dourado fosco em 6/8, preto fosco em 6/8."
    - "Formas/curvas orgânicas usadas como contraponto à marcenaria retilínea — confiança média-alta: o princípio formal de curva/forma orgânica aparece em 6 a 8/8 projetos; já o produto nomeado literalmente 'painel orgânico em gesso' está concentrado sobretudo em 2 projetos (ClinicaPatricia-2026 e Debora-Deivisson-2026) — não tratar o nome exato do produto como assinatura universal, apenas o princípio formal mais amplo."
    - "Elementos de estilização (tapete, almofada, vaso) usados para suavizar ambientes de marcenaria rígida — confiança média-alta: 7/8 projetos, mas com baixo detalhamento textual (cor/padronagem não especificados na maioria dos casos)."
  functional:
    - "Nota padronizada de verificação em obra ('CONFIRMAR MEDIDAS NO LOCAL ANTES DA EXECUÇÃO') anexada às pranchas de marcenaria antes da fabricação — alta confiança: 7/8 projetos."
    - "Instrução explícita de ocultar fiação/LED ('NÃO DEIXAR LED APARENTE' / 'NÃO DEIXAR FIAÇÃO APARENTE') nas cavas de iluminação embutida — confiança média-alta: nota explícita em 4/8 projetos; o elemento fita de LED embutida em si está presente em 8/8 projetos."
    - "Nota geral de coordenação entre plano de forro e plano de iluminação, reaproveitada quase verbatim entre projetos executivos — confiança média: frase idêntica encontrada em 3/8 projetos (ClinicaPatricia-2026, Gabi-2024, Patricia-Rafael-2025)."
  lighting:
    - "Fita de LED embutida e contínua como solução dominante de iluminação indireta — alta confiança: 8/8 projetos."
    - "Spots embutidos como iluminação geral complementar — alta confiança: 7/8 projetos (contagem restrita ao termo isolado 'SPOT'; incluindo variações/compostos, 8/8)."
    - "Pendentes como elemento de iluminação decorativa pontual (sobre bancadas, mesas, aparadores) — alta confiança: 6/8 projetos."
    - "Temperatura de cor da luz especificada consistentemente em 2700K ou 3000K (luz quente) — alta confiança: 8/8 projetos."
    - "Trilho eletrificado como solução pontual, não universal — confiança média: 3/8 projetos (ClinicaPatricia-2026, Gabi-2024, Patricia-Rafael-2025)."
  materiality:
    - "MDF (majoritariamente linha Duratex, com nomes de cor específicos como 'Carvalho Hanover', 'Cinza Fóssil', 'Branco Diamante') como substrato dominante de marcenaria — alta confiança: MDF em 8/8 projetos; marca Duratex citada em 8/8 projetos."
    - "Mármore/pedra natural especificado em bancadas — alta confiança: 7/8 projetos."
    - "Porcelanato em revestimentos de piso/parede — alta confiança: 7/8 projetos."
    - "Vidro em boxes, guarda-corpos e tampos — alta confiança: 8/8 projetos."
    - "Puxadores e perfis metálicos com acabamento dourado fosco ou preto fosco, frequentemente da marca Zen Design — alta confiança: puxador especificado em 8/8 projetos; marca Zen Design em 7/8 projetos."
    - "Tinta da marca Suvinil especificada nominalmente — alta confiança: 7/8 projetos (marcas alternativas como Coral aparecem só em ClinicaPatricia-2026 — preferência pontual, não assinatura)."
