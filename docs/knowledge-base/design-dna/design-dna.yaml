conditional_patterns:
  - "Quando o ambiente é sala de estar/TV, quarto, cozinha com ilha, sala de jantar ou closet — todos esses room_patterns são, por definição de programa, EXCLUSIVOS do segmento residencial neste acervo: os termos 'PAINEL DE TV', 'CABECEIRA', 'ILHA', 'CLOSET' e 'MESA DE JANTAR' tiveram ZERO ocorrências verificadas diretamente nos 5 documentos dos 2 projetos comerciais (ClinicaPatricia-2026, Tavora-2026). Não é uma lacuna de dados — é esperado que clínica e loja não tenham esses ambientes no programa."
  - "Quando o ambiente é banheiro, lavabo ou cozinha (bancada/cuba, não ilha), o padrão dominante é bancada em mármore/pedra com cuba de apoio ou esculpida, presente em ambos os segmentos (7-8/8 projetos; bancada+cuba confirmados em ClinicaPatricia-2026 e Tavora-2026; mármore especificamente só em 1/2 comercial)."
  - "Quando há espelho como elemento decorativo, ele aparece de forma ampla em praticamente todo o acervo (reclassificado nesta passada — ver signature_patterns.materials), não mais tratado como padrão de nicho de poucos projetos."
  - "Quando o projeto é comercial (clínica/loja, como ClinicaPatricia-2026 e Tavora-2026), a documentação inclui prancha(s) dedicada(s) de fachada, confirmadas em ambos os 2 projetos comerciais. A estrutura completa de índice numerado por ambiente no formato 'PLANTA DE LAYOUT E TÉCNICA <AMBIENTE>' + 'VISTAS <AMBIENTE>' tem evidência textual completa apenas em ClinicaPatricia-2026 — não confirmada com o mesmo nível de detalhe em Tavora-2026 nesta passada. Essa estrutura de índice não deve ser presumida como idêntica para fachada residencial: apenas 1/6 projetos residenciais (Patricia-Rafael-2025) tem estrutura equivalente e completa de fachada; ver room_patterns.fachada para a hipótese (não confirmada) de que isso depende de o imóvel ser casa ou apartamento, não de ser comercial ou residencial."
  - "Quando a prancha é de detalhamento de marcenaria (não de layout/planta), ela segue a convenção fixa: vista topo + vista A + vista B + perspectiva ('PESPECTIVA'), cada uma com escala própria, mais nota de confirmação de medidas em obra — alta confiança, ambos os segmentos (8/8 projetos; convenção e grafia confirmadas diretamente também nos documentos comerciais)."

