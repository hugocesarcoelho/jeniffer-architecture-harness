  insufficient_evidence:
    - "'Branco Gatinho efeito veludo' como cor/acabamento de pintura — aparece apenas em ClinicaPatricia-2026 (88 ocorrências, 3 documentos, 1 client_project). É preferência daquele cliente/projeto específico, não deve ser tratada como assinatura da arquiteta enquanto não aparecer em outros projetos."
    - "Efeito 'veludo' (VELVET) de pintura de forma geral — 84 ocorrências concentradas em ClinicaPatricia-2026 (83) com apenas 1 menção isolada em Patricia-Rafael-2025; evidência insuficiente (2 client_projects, fortemente desbalanceado) para tratar como padrão geral."
    - "'Grafite'/'Chumbo' como cor de marcenaria — aparece apenas em Gabi-2024 (1 client_project). Preferência pontual do cliente, não assinatura."
    - "Marca de tinta 'Coral' — aparece apenas em ClinicaPatricia-2026 (1 client_project). Preferência pontual do cliente."
    - "avoid_patterns: não foi possível preencher com segurança a partir do acervo. Os documentos registram decisões executadas, não decisões recusadas; não foram encontradas notas explícitas do tipo 'evitar cor/material X' na amostra revisada (as ocorrências de 'evitar' encontradas referem-se a coordenação técnica de obra — ex.: evitar incompatibilidade entre forro e iluminação, evitar retorno de água — não a preferências estéticas). Recomenda-se que a arquiteta informe explicitamente o que evita."
    - "room_patterns.fachada: evidência limitada a 2 projetos comerciais (ClinicaPatricia-2026 — clínica, Tavora-2026 — loja) mais uma citação isolada em Patricia-Rafael-2025. Não há evidência de fachada residencial no acervo atual — não generalizar."
    - "signature_patterns.styling e composição de renders (cor de tapete, padronagem de almofada etc.): o texto extraído é predominantemente técnico; para aprofundar esse eixo seria necessário revisar sistematicamente as imagens de página e embedded-images de cada documento, o que não foi feito de forma exaustiva nesta passada (apenas leitura textual ampla, conforme escopo da tarefa)."
